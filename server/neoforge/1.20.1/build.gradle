plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'me.minecraftauth'
version = rootProject.version

base {
    archivesName = 'MinecraftAuth-NeoForge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = '21.1.45'

    // Default run configurations. Tweak/remove as needed.
    runs {
        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.findProperty('modid') ?: 'minecraftauth', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.findProperty('modid') ?: 'minecraftauth'}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    shaded project(':common')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'  : (project.findProperty('modid') ?: 'minecraftauth'),
                'Specification-Vendor' : 'minecraftauth',
                'Specification-Version': '1',
                'Implementation-Title' : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'minecraftauth',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    archiveBaseName.set('MCAuth-NeoForge')
    archiveClassifier.set('')
    destinationDirectory = file("$rootDir/.libs/mod/neo/")
}

// IDEA: download sources/javadoc for dependencies
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
